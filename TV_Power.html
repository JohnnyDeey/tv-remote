<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Power</title>
  <style>
    body { background:#111; color:#fff; font-family:monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:20px; box-sizing:border-box; }
    .status { font-size:18px; font-weight:bold; margin:20px 0; padding:12px 24px; border-radius:8px; }
    .on { background:#1b5e20; color:#66bb6a; }
    .off { background:#b71c1c; color:#ef5350; }
    .busy { background:#1a237e; color:#90caf9; }
    .buttons { display:flex; gap:16px; margin:20px 0; }
    button { padding:20px 40px; border:none; border-radius:12px; font-size:18px; cursor:pointer; font-weight:bold; }
    .btn-on { background:#66bb6a; color:#000; }
    .btn-off { background:#ef5350; color:#fff; }
    #log { background:#000; padding:16px; border-radius:8px; width:100%; max-width:500px; height:250px; overflow-y:auto; font-size:11px; margin-top:16px; }
    .ok { color:#66bb6a; } .err { color:#ef5350; } .info { color:#4fc3f7; }
    input { background:#222; border:1px solid #444; color:#fff; padding:8px; border-radius:6px; width:160px; margin:4px; font-size:13px; }
    label { font-size:12px; color:#aaa; }
    .row { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; justify-content:center; }
  </style>
</head>
<body>
  <h2>📺 TV Power Test</h2>

  <div class="row">
    <label>TV IP<br><input id="tvIp" value="192.168.68.109"></label>
    <label>Token<br><input id="tvToken" value="27761039"></label>
    <label>Bridge IP<br><input id="bridgeIp" value="192.168.68.107"></label>
  </div>

  <div id="status" class="status off">● TV: UNKNOWN</div>

  <div class="buttons">
    <button class="btn-on" onclick="tvOn()">⚡ ON</button>
    <button class="btn-off" onclick="tvOff()">⏻ OFF</button>
  </div>

  <button onclick="copyLog()" style="background:#1e88e5;color:#fff;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;">📋 Copy Log</button>

  <div id="log"></div>

  <script>
    let ws = null;
    let digiWs = null;
    let connected = false;
    let busy = false;
    const APP_NAME = btoa('TVRemote-FVWHO');

    function getTV() { return document.getElementById('tvIp').value.trim(); }
    function getToken() { return document.getElementById('tvToken').value.trim(); }
    function getBridge() { return document.getElementById('bridgeIp').value.trim(); }

    function log(msg, type='info') {
      const div = document.getElementById('log');
      div.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      div.scrollTop = div.scrollHeight;
    }
    function copyLog() {
      navigator.clipboard.writeText(document.getElementById('log').innerText).then(() => log('Copied!', 'ok'));
    }
    function setStatus(text, cls) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + cls;
    }

    // ── BRIDGE ──────────────────────────────────────
    function connectBridge() {
      if (digiWs && digiWs.readyState === WebSocket.OPEN) return;
      digiWs = new WebSocket(`ws://${getBridge()}:8765`);
      digiWs.onopen = () => log('Bridge connected', 'ok');
      digiWs.onmessage = (e) => log(`Bridge: ${e.data}`, 'info');
      digiWs.onerror = () => log('Bridge error', 'err');
      digiWs.onclose = () => { log('Bridge closed', 'err'); setTimeout(connectBridge, 3000); }
    }

    function sendWol() {
      if (digiWs && digiWs.readyState === WebSocket.OPEN) {
        digiWs.send(JSON.stringify({ action: 'wol' }));
        log('WoL sent via bridge', 'ok');
      }
    }

    // ── WEBSOCKET ───────────────────────────────────
    function connectWS() {
      return new Promise((resolve, reject) => {
        if (ws) { try { ws.close(); } catch(e){} ws = null; }
        const token = getToken();
        const url = token
          ? `wss://${getTV()}:8002/api/v2/channels/samsung.remote.control?name=${APP_NAME}&token=${token}`
          : `wss://${getTV()}:8002/api/v2/channels/samsung.remote.control?name=${APP_NAME}`;
        
        log(`Connecting WSS...`);
        ws = new WebSocket(url);
        
        const timeout = setTimeout(() => {
          if (ws) { try { ws.close(); } catch(e){} ws = null; }
          reject(new Error('timeout'));
        }, 8000);

        ws.onopen = () => log('WSS open', 'info');
        ws.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.event === 'ms.channel.connect') {
              clearTimeout(timeout);
              connected = true;
              if (msg.data?.token) {
                document.getElementById('tvToken').value = msg.data.token;
                log(`Token updated: ${msg.data.token}`, 'ok');
              }
              setStatus('● TV: ON', 'on');
              resolve(true);
            }
            if (msg.event === 'ms.channel.unauthorized') {
              log('⚠ Unauthorized - check TV', 'err');
            }
          } catch(err) {}
        };
        ws.onerror = () => { clearTimeout(timeout); reject(new Error('ws error')); };
        ws.onclose = () => {
          clearTimeout(timeout);
          connected = false;
          if (!busy) setStatus('● TV: OFF/STANDBY', 'off');
        };
      });
    }

    function sendKey(key) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return false;
      ws.send(JSON.stringify({
        method: 'ms.remote.control',
        params: { Cmd: 'Click', DataOfCmd: key, Option: 'false', TypeOfRemote: 'SendRemoteKey' }
      }));
      return true;
    }

    // ── TV ON ───────────────────────────────────────
    async function tvOn() {
      if (busy) { log('Busy - please wait', 'err'); return; }
      if (connected) { log('TV already ON', 'info'); return; }
      busy = true;
      setStatus('● Waking TV...', 'busy');
      log('=== TV ON ===');

      // Send WoL
      sendWol();

      // Try connecting repeatedly
      let attempt = 0;
      while (attempt < 40) {
        attempt++;
        log(`Connect attempt ${attempt}/40...`);
        try {
          await connectWS();
          // Connected! Now send KEY_POWER to turn screen on
          await new Promise(r => setTimeout(r, 500));
          sendKey('KEY_POWER');
          log('✅ TV ON - KEY_POWER sent', 'ok');
          busy = false;
          return;
        } catch(e) {
          log(`Attempt ${attempt} failed: ${e.message}`, 'err');
          // Resend WoL every 5 attempts
          if (attempt % 5 === 0) sendWol();
          await new Promise(r => setTimeout(r, 3000));
        }
      }

      setStatus('● TV: FAILED', 'off');
      log('❌ Could not wake TV', 'err');
      busy = false;
    }

    // ── TV OFF ──────────────────────────────────────
    function tvOff() {
      if (!connected) { log('TV already OFF', 'info'); return; }
      log('=== TV OFF ===');
      sendKey('KEY_POWER');
      connected = false;
      setStatus('● TV: OFF', 'off');
      if (ws) { try { ws.close(); } catch(e){} ws = null; }
      log('✅ KEY_POWER sent', 'ok');
    }

    // ── INIT ────────────────────────────────────────
    window.onload = () => {
      connectBridge();
      // Try connecting to TV on load
      connectWS().catch(() => setStatus('● TV: OFF/STANDBY', 'off'));
    };
  </script>
</body>
</html>
